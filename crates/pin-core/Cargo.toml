[package]
name = "pin-core"
version.workspace = true
edition.workspace = true

[features]
default = []
oci = ["dep:reqwest", "dep:sha2"]
gitlab = ["dep:reqwest"]
yaml = ["dep:saphyr-parser"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
saphyr-parser = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }

[[test]]
name = "mock_registry"
required-features = ["oci"]

[[test]]
name = "registry_hosts"
required-features = ["oci"]

[[test]]
name = "hub_api"
required-features = ["oci"]

[[test]]
name = "gitlab_client"
required-features = ["gitlab"]

[[test]]
name = "live_gitlab"
required-features = ["gitlab"]

[[test]]
name = "oci_decide"
required-features = ["oci"]

[[test]]
name = "memo"
required-features = ["oci", "gitlab"]
