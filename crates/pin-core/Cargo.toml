[package]
name = "pin-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
oci = ["dep:reqwest", "dep:sha2"]
gitlab = ["dep:reqwest"]
yaml = ["dep:saphyr-parser"]
# Test hooks (base-URL overrides; raw registry/GitLab clients, preset Ctx
# resolvers, process-env ResolverEnv); enabled only by dev-dependencies (D38).
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
saphyr-parser = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }

[[test]]
name = "mock_registry"
required-features = ["oci", "test-support"]

[[test]]
name = "registry_hosts"
required-features = ["oci", "test-support"]

[[test]]
name = "hub_api"
required-features = ["oci", "test-support"]

[[test]]
name = "gitlab_client"
required-features = ["gitlab", "test-support"]

[[test]]
name = "live_gitlab"
required-features = ["gitlab", "test-support"]

[[test]]
name = "oci_decide"
required-features = ["oci", "test-support"]

[[test]]
name = "memo"
required-features = ["oci", "gitlab", "test-support"]

[[test]]
name = "gitlab_hosts"
required-features = ["gitlab", "test-support"]
