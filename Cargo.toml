[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pin-core = { path = "crates/pin-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
wiremock = "0.6"
insta = "1"
saphyr-parser = "0.3.3"
