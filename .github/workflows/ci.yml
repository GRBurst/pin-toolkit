# CI, Cachix and releases (spec §8.3). Every `uses:` is pinned by commit
# SHA (dogfooding); `# vX` names the tag the SHA was taken from.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/grburst/pin-toolkit

jobs:
  nix:
    name: nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Cachix is opt-in by the repository owner: create the cache, then set the
      # repository variable CACHIX_CACHE to its name (Settings > Secrets and
      # variables > Actions > Variables) and the secret CACHIX_AUTH_TOKEN. Until
      # then (and in forks) the job builds without Cachix. Gating on an owner-set
      # variable, not on a public probe, means nobody who registers the same name
      # on cachix.org first can make this workflow trust their signing key.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }} # never handed to PR runs
          skipPush: ${{ github.event_name != 'push' }}
      - run: nix flake check -L
      - run: nix build -L .#pin-toolkit

  advisories:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: RustSec advisories (network; not a flake check)
        run: nix shell --inputs-from . nixpkgs#cargo nixpkgs#cargo-deny -c cargo deny check advisories

  tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # origin/main for the ancestry check below
      - name: Tag commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $TAG points at $GITHUB_SHA, which is not on main"; exit 1; }
      - name: Tag equals workspace.package.version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml workspace.package.version $version"
            exit 1
          fi

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix, tag-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the draft release once (never touch a published one)
        run: |
          # only "release not found" means create; any other error (5xx, rate limit)
          # must fail, or a re-run could create a second draft for the same tag
          err=$RUNNER_TEMP/gh-release-view.err
          if is_draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2> "$err"); then
            [ "$is_draft" = true ] \
              || { echo "::error::release $TAG is already published; refusing to modify it"; exit 1; }
            echo "draft release $TAG exists (re-run): keeping it"
          elif grep -q 'release not found' "$err"; then
            flags=(--draft --verify-tag --generate-notes --title "$TAG")
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" "${flags[@]}"
          else
            echo "::error::gh release view $TAG failed: $(cat "$err")"
            exit 1
          fi

  binaries:
    needs: create-release
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Cachix here: the attested bytes are built from source + cache.nixos.org only
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build the release assets (tar.gz + .sha256, checks.dist)
        run: nix build -L .#dist --out-link dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - run: gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber

  images:
    needs: create-release
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Cachix here either (see binaries)
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix build -L .#container
      - name: Push ${{ env.IMAGE }}:<version>-${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/containers-auth.json # a path a non-root user can write
        run: |
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- "$@"; }
          skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          skopeo --insecure-policy copy docker-archive:result "docker://$IMAGE:${TAG#v}-$ARCH"

  manifest:
    # after binaries too: :<version> and :latest go public only once every release
    # asset exists, so a failed binaries job never leaves a public tag that the
    # delete-the-draft-and-re-tag recovery would then rewrite
    needs: [images, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - name: Create ${{ env.IMAGE }}:<version> and :latest
        id: index
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          version=${TAG#v}
          tags=(-t "$IMAGE:$version")
          case "$version" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          [[ $digest == sha256:* ]] || { echo "::error::unexpected index digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [binaries, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - run: gh release edit "$TAG" --draft=false
